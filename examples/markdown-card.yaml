# Markdown-Karte für AC PID Frequency
# Einzige Anpassung: die Entität des Status-Sensors in der ersten Zeile des Templates
# (Einstellungen → Geräte & Dienste → AC PID Frequency → Gerät → Diagnose → "Status").
# Alle anderen Entitäten (Hz, Ziel, Raum, Außen, Sendetemperatur ...) liest das
# Template selbst aus den Attributen dieses Sensors.
type: markdown
content: |-
  {% set st = 'sensor.ac_pid_scm40_status' -%}
  {% set status = states(st) -%}
  {% set clim = state_attr(st, 'ac_pid_frequency_climate') -%}
  {% set pt = state_attr(st, 'passthrough') -%}
  {% set e_hz = state_attr(st, 'frequency_entity') -%}
  {% set e_tgt = state_attr(st, 'target_hz_entity') -%}
  {% set e_room = state_attr(st, 'room_temperature_entity') -%}
  {% set e_out = state_attr(st, 'outdoor_temperature_entity') -%}
  {% set e_sim = state_attr(st, 'temperature_entity') -%}
  {% set e_off = state_attr(st, 'offset_entity') -%}
  {% set soll = (state_attr(clim, 'temperature') | float(none)) if clim else none -%}
  {% set hz = (states(e_hz) | float(none)) if e_hz else none -%}
  {% set ziel = (states(e_tgt) | float(none)) if e_tgt else none -%}
  {% set min_hz = state_attr(st, 'learned_min_hz') -%}
  {% set raum = (states(e_room) | float(none)) if e_room else none -%}
  {% set aussen = (state_attr(e_out, 'temperature') | float(none) if e_out.startswith('weather.') else states(e_out) | float(none)) if e_out else none -%}
  {% set sim = (states(e_sim) | float(none)) if e_sim else none -%}
  {% set d = (states(e_off) | float(none)) if e_off else none -%}
  {% set lern = state_attr(st, 'learned_offset') -%}
  {% set zonen = {'cold': 'Frost (< 2 °C)', 'normal': 'Übergang (2–10 °C)', 'warm': 'Mild (> 10 °C)', 'none': 'ohne Außensensor'} -%}
  {% set bereiche = {'low': '< 28 Hz', 'mid_low': '28–38 Hz', 'mid_high': '38–50 Hz', 'high': '≥ 50 Hz'} -%}
  {% set phase = {
    'off': ('Durchgereicht' if pt else 'Aus'),
    'idle': ('Durchgereicht' if pt else 'Pausiert'),
    'raise': 'Fallen (Anlage anschieben)',
    'lower': 'Steigen (Frequenz senken)',
    'hold': 'Halten (stabil)',
    'min_mod': 'Mindestmodulation (stabil gehalten)',
    'defrost': 'Eingefroren (Abtauen)',
    'overheat': 'Steigen (Überhitzung)',
    'waiting': 'Halten (Daten fehlen)',
    'fault': 'Nicht verfügbar'} -%}
  {% set titel = {
    'off': '⏸ Regler AUS',
    'idle': '⏸ Anlage nicht im Heizmodus',
    'raise': '🔼 Frequenz zu niedrig',
    'lower': '🔽 Frequenz zu hoch',
    'hold': '✅ Im Zielbereich',
    'min_mod': '⚓ Mindestmodulation erreicht',
    'defrost': '❄ Abtauen',
    'overheat': '🌡 Raum zu warm',
    'waiting': '⏳ Daten fehlen',
    'fault': '⚠ Fehler'} -%}
  {% set text = {
    'off': 'Die Sendetemperatur wird nicht geregelt.',
    'idle': 'Die Regelung pausiert.',
    'raise': 'Die Sendetemperatur wird schrittweise gesenkt, bis die Anlage hochfährt.',
    'lower': 'Die Sendetemperatur wird angehoben, bis die Frequenz sinkt.',
    'hold': 'Die Sendetemperatur wird gehalten, der Erfahrungswert wird gelernt.',
    'min_mod': 'Ziel liegt unterhalb der Mindestmodulation: Anlage wird stabil auf Minimum gehalten und schaltet nicht aus.',
    'defrost': 'Regelung und Lernen pausieren während des Abtauens.',
    'overheat': 'Der Überhitzungsschutz drosselt die Frequenz.',
    'waiting': 'Eingangsdaten fehlen, der letzte Wert wird gehalten.',
    'fault': 'Eingangsdaten fehlen zu lange, die Anlage nutzt ihren eigenen Sensor.'} -%}
  {% if status in ['unavailable', 'unknown'] or not clim -%}
  ### ⚠ AC PID Frequency nicht verfügbar
  Status-Sensor `{{ st }}` nicht gefunden oder nicht verfügbar.
  {%- else -%}
  ### {{ titel.get(status, status) }}
  {{ text.get(status, '') }}
  {%- if status in ['off', 'idle'] %}
  {{ 'Die echte Raumtemperatur wird an die Anlage durchgereicht.' if pt else 'Die Anlage nutzt ihren eigenen Sensor.' }}
  {%- endif %}

  | Frequenz | |
  |:--|--:|
  | Ziel | **{{ (ziel | round(0) | int ~ ' Hz') if ziel is number else '–' }}** |
  | Ist | **{{ (hz | round(1) ~ ' Hz') if hz is number else '–' }}** |
  {% if hz is number and ziel is number -%}
  | Abweichung | {{ '%+.1f' | format(hz - ziel) }} Hz |
  {% endif -%}
  | Erlernte Mindest-Hz | **{{ (min_hz | round(1) ~ ' Hz') if min_hz is number else '–' }}** |

  | Temperatur | |
  |:--|--:|
  | Soll | {{ (soll ~ ' °C') if soll is number else '–' }} |
  {% if e_room -%}
  | Raum (real) | **{{ (raum | round(1) ~ ' °C') if raum is number else '–' }}**{{ ' (' ~ ('%+.1f' | format(raum - soll)) ~ ' K zum Soll)' if raum is number and soll is number else '' }} |
  {% endif -%}
  {% if e_out -%}
  | Außen | {{ (aussen | round(1) ~ ' °C') if aussen is number else '–' }} |
  {% endif %}
  | Sendetemperatur | |
  |:--|--:|
  | Wert (simuliert) | {{ (sim | round(1) ~ ' °C') if sim is number else 'nicht verfügbar' }}{{ ' (d = ' ~ ('%+.2f' | format(d)) ~ ')' if d is number else '' }} |
  | Phase | **{{ phase.get(status, status) }}** |
  {% if lern is number and status not in ['off', 'idle'] -%}
  | Erfahrungswert | {{ lern | round(2) }} K ({{ zonen.get(state_attr(st, 'active_outdoor_bin'), '–') }}, {{ bereiche.get(state_attr(st, 'active_freq_bin'), '–') }}) |
  {%- endif %}
  {%- endif %}
